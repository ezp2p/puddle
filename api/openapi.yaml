openapi: 3.1.0
info:
  title: Puddle owner API
  version: 0.2.0
  description: |
    The owner's apps (the desktop window, phone clients) talking to their own Puddle. Every response is one of the
    objects in objects/ (one file each), or a page of them. Code: src/core/api/ (routes) and src/core/objects/ (objects).
    Other Puddles use the stream API instead (federation.yaml).

    Conventions:
    - Only GET and POST. GET reads; POST acts, with the verb last in the path (`.../block`, `.../messages/send`).
    - Paths name an object, then an action: `/users/{user}/block`. An id of the wrong form is a 404, before any handler.
    - Every POST answers with the object it changed, so an app never has to read it again.
    - Nothing is public. Every route needs `Authorization: Bearer <owner token>`; without it the answer is 404,
      like a path that does not exist.
    - Errors are objects/error.yaml: `{"error": "<code>", "message"?}`.
    - Lists come in pages (page.yaml): `items` and `next`, asked for with `limit` + `offset`. Messages come newest
      page first, each page oldest first; other lists newest first.
    - An answer that is a file rather than JSON (a picture, a file's contents) is sent as it is read from disk, with
      `Accept-Ranges: bytes`. One `Range` is honoured (`206 Partial Content`, or `416` past the end); several are answered
      with the whole file.
    - This API changes as the apps need it. The stream API (../federation) is the one that has to stay put.

servers:
  - url: https://localhost:8443

security:
  - owner: []

tags:
  - { name: users, description: People this Puddle knows, and the owner }
  - { name: streams, description: Connections to other Puddles }
  - { name: conversations, description: DMs and groups alike, and their messages }
  - { name: groups, description: Group chats }
  - { name: ponds, description: "Community servers the owner is in: their channels and messages, through this Puddle (docs/ponds.md)" }
  - { name: identity, description: This Puddle's keys }
  - { name: profiles, description: "The owner's profiles: files in the data folder, each shown only where the owner chooses (docs/profiles.md)" }
  - { name: invites, description: Links that are accepted automatically }
  - { name: files, description: "Files sent in chats: uploaded a chunk at a time, then sent in a message (docs/files.md)" }
  - { name: updates, description: Objects as they change }

paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { const: ok } } } } } }

  # ---- users ----
  /api/v1/users/me:
    get:
      tags: [users]
      summary: The owner
      responses:
        "200": { $ref: "#/components/responses/SelfUser" }
  /api/v1/users/{user}:
    parameters: [{ $ref: "#/components/parameters/User" }]
    get:
      tags: [users]
      summary: A person this Puddle knows
      responses:
        "200": { $ref: "#/components/responses/User" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/users/{user}/profiles:
    parameters: [{ $ref: "#/components/parameters/User" }]
    get:
      tags: [users]
      summary: Every profile they show us, one per place we share (directly, and in each group), with notes on what was left out
      responses:
        "200": { description: OK, content: { application/json: { schema: { allOf: [{ $ref: "page.yaml" }, { properties: { items: { items: { $ref: "objects/received_profile.yaml" } } } }] } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/users/{user}/block:
    parameters: [{ $ref: "#/components/parameters/User" }]
    post:
      tags: [users]
      summary: Block them. Nothing more is sent to them or taken from them, and they are never told.
      responses:
        "200": { $ref: "#/components/responses/User" }
  /api/v1/users/{user}/unblock:
    parameters: [{ $ref: "#/components/parameters/User" }]
    post:
      tags: [users]
      summary: Unblock them
      responses:
        "200": { $ref: "#/components/responses/User" }
  /api/v1/blocks:
    get:
      tags: [users]
      summary: Everyone blocked
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { allOf: [{ $ref: "page.yaml" }, { properties: { items: { items: { $ref: "objects/block.yaml" } } } }] } } } }

  # ---- streams ----
  /api/v1/streams:
    get:
      tags: [streams]
      summary: Every stream, newest change first
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { allOf: [{ $ref: "page.yaml" }, { properties: { items: { items: { $ref: "objects/stream.yaml" } } } }] } } } }
  /api/v1/streams/request:
    post:
      tags: [streams]
      summary: Ask someone for a stream, by address
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, description: "An address, optionally puddle://, optionally with ?invite=" }
                message: { type: string, maxLength: 500 }
                profile: { type: string, description: "Which of the owner's profiles they will see; absent: none, and they see only the id" }
      responses:
        "200": { $ref: "#/components/responses/Stream" }
  /api/v1/streams/{user}:
    parameters: [{ $ref: "#/components/parameters/User" }]
    get:
      tags: [streams]
      summary: One stream
      responses:
        "200": { $ref: "#/components/responses/Stream" }
  /api/v1/streams/{user}/accept:
    parameters: [{ $ref: "#/components/parameters/User" }]
    post:
      tags: [streams]
      summary: Say yes to their request
      requestBody: { content: { application/json: { schema: { type: object, properties: { profile: { type: string, description: "Which of the owner's profiles they will see; absent: none (they see only the id)" } } } } } }
      responses: { "200": { $ref: "#/components/responses/Stream" } }
  /api/v1/streams/{user}/decline:
    parameters: [{ $ref: "#/components/parameters/User" }]
    post: { tags: [streams], summary: Say no to their request, responses: { "200": { $ref: "#/components/responses/Stream" } } }
  /api/v1/streams/{user}/delete:
    parameters: [{ $ref: "#/components/parameters/User" }]
    post: { tags: [streams], summary: Withdraw a request, or end a stream, responses: { "200": { $ref: "#/components/responses/Stream" } } }
  /api/v1/streams/{user}/trust:
    parameters: [{ $ref: "#/components/parameters/User" }]
    post: { tags: [streams], summary: Accept their changed certificate, responses: { "200": { $ref: "#/components/responses/Stream" } } }
  /api/v1/streams/{user}/profile:
    parameters: [{ $ref: "#/components/parameters/User" }]
    post:
      tags: [streams]
      summary: Choose which of the owner's profiles they see directly; they are told
      requestBody: { content: { application/json: { schema: { type: object, required: [profile], properties: { profile: { type: [string, "null"], description: "null: none; they are told to forget the one they had" } } } } } }
      responses: { "200": { $ref: "#/components/responses/Stream" } }
  /api/v1/streams/policy:
    get:
      tags: [streams]
      summary: Who may ask
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "objects/access_policy.yaml" } } } } }
  /api/v1/streams/policy/set:
    post:
      tags: [streams]
      summary: Change who may ask
      requestBody: { content: { application/json: { schema: { $ref: "objects/access_policy.yaml" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "objects/access_policy.yaml" } } } } }

  # ---- conversations ----
  /api/v1/conversations:
    get:
      tags: [conversations]
      summary: Every DM and group, newest first
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { allOf: [{ $ref: "page.yaml" }, { properties: { items: { items: { $ref: "objects/conversation.yaml" } } } }] } } } }
  /api/v1/conversations/{conversation}:
    parameters: [{ $ref: "#/components/parameters/Conversation" }]
    get:
      tags: [conversations]
      summary: One conversation
      responses: { "200": { $ref: "#/components/responses/Conversation" } }
  /api/v1/conversations/{conversation}/messages:
    parameters: [{ $ref: "#/components/parameters/Conversation" }]
    get:
      tags: [conversations]
      summary: Its history, oldest first, a page at a time. Group notices are messages too (`type`).
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { allOf: [{ $ref: "page.yaml" }, { properties: { items: { items: { $ref: "objects/message.yaml" } } } }] } } } }
  /api/v1/conversations/{conversation}/messages/send:
    parameters: [{ $ref: "#/components/parameters/Conversation" }]
    post:
      tags: [conversations]
      summary: Send a message. A DM needs an active stream (`no_stream` otherwise).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: "`body`, `files`, or both"
              properties:
                body: { type: string, minLength: 1, maxLength: 4000, description: "The words; may be left out when there are files" }
                reply_to: { $ref: "wire/ids.yaml#/$defs/EventId" }
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: |
                    Files uploaded already (/api/v1/files/uploads), described as the message will show them. Their
                    size is what was uploaded. `no_such_file` if one was not, `bad_file` if a name or type breaks the rules.
                  items:
                    type: object
                    required: [id, name, mime]
                    properties:
                      id: { type: string, pattern: "^[0-9a-f]{64}$" }
                      name: { type: string, maxLength: 255 }
                      mime: { type: string, maxLength: 127 }
                      w: { type: integer, minimum: 1, maximum: 100000 }
                      h: { type: integer, minimum: 1, maximum: 100000 }
                      duration_ms: { type: integer, minimum: 1 }
                      preview: { type: string, contentEncoding: base64, description: "At most 1 KiB of image" }
      responses:
        "201": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{conversation}/messages/{message}/edit:
    parameters: [{ $ref: "#/components/parameters/Conversation" }, { $ref: "#/components/parameters/Message" }]
    post:
      tags: [conversations]
      summary: Change the text of one of the owner's own messages
      requestBody: { content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 4000 } } } } } }
      responses: { "200": { $ref: "#/components/responses/Message" } }
  /api/v1/conversations/{conversation}/messages/{message}/delete:
    parameters: [{ $ref: "#/components/parameters/Conversation" }, { $ref: "#/components/parameters/Message" }]
    post:
      tags: [conversations]
      summary: Take back one of the owner's own messages (a request to hide, not a guarantee)
      responses: { "200": { $ref: "#/components/responses/Message" } }
  /api/v1/conversations/{conversation}/read:
    parameters: [{ $ref: "#/components/parameters/Conversation" }]
    post: { tags: [conversations], summary: Mark everything read, responses: { "200": { $ref: "#/components/responses/Conversation" } } }
  /api/v1/conversations/{conversation}/retry:
    parameters: [{ $ref: "#/components/parameters/Conversation" }]
    post: { tags: [conversations], summary: Try again to deliver what is stuck, responses: { "200": { $ref: "#/components/responses/Conversation" } } }

  # ---- groups ----
  /api/v1/groups:
    get:
      tags: [groups]
      summary: Groups the owner is in or invited to
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { allOf: [{ $ref: "page.yaml" }, { properties: { items: { items: { $ref: "objects/group.yaml" } } } }] } } } }
  /api/v1/groups/create:
    post:
      tags: [groups]
      summary: Start a group, inviting friends. Those who could not be asked are listed beside it, with why.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                members: { type: array, items: { $ref: "wire/ids.yaml#/$defs/UserId" } }
                profile: { type: string, description: "Which of the owner's profiles the members will see; absent: none" }
      responses:
        "201":
          description: Made
          content:
            application/json:
              schema:
                type: object
                required: [group, not_invited]
                properties:
                  group: { $ref: "objects/group.yaml" }
                  not_invited:
                    type: array
                    items: { type: object, properties: { user: { type: string }, reason: { type: string } } }
  /api/v1/groups/{group}:
    parameters: [{ $ref: "#/components/parameters/Group" }]
    get: { tags: [groups], summary: One group, responses: { "200": { $ref: "#/components/responses/Group" } } }
  /api/v1/groups/{group}/invite:
    parameters: [{ $ref: "#/components/parameters/Group" }]
    post:
      tags: [groups]
      summary: Invite a friend
      requestBody: { content: { application/json: { schema: { type: object, required: [user], properties: { user: { $ref: "wire/ids.yaml#/$defs/UserId" } } } } } }
      responses: { "200": { $ref: "#/components/responses/Group" } }
  /api/v1/groups/{group}/accept:
    parameters: [{ $ref: "#/components/parameters/Group" }]
    post:
      tags: [groups]
      summary: Say yes to an invitation
      requestBody: { content: { application/json: { schema: { type: object, properties: { profile: { type: string, description: "Which of the owner's profiles the members will see; absent: none (they see only the id)" } } } } } }
      responses: { "200": { $ref: "#/components/responses/Group" } }
  /api/v1/groups/{group}/profile:
    parameters: [{ $ref: "#/components/parameters/Group" }]
    post:
      tags: [groups]
      summary: Choose which of the owner's profiles the members see; they are told
      requestBody: { content: { application/json: { schema: { type: object, required: [profile], properties: { profile: { type: [string, "null"], description: "null: none; they are told to forget the one they had" } } } } } }
      responses: { "200": { $ref: "#/components/responses/Group" } }
  /api/v1/groups/{group}/decline:
    parameters: [{ $ref: "#/components/parameters/Group" }]
    post: { tags: [groups], summary: Say no to an invitation, responses: { "200": { $ref: "#/components/responses/Group" } } }
  /api/v1/groups/{group}/leave:
    parameters: [{ $ref: "#/components/parameters/Group" }]
    post: { tags: [groups], summary: Leave, responses: { "200": { $ref: "#/components/responses/Group" } } }
  /api/v1/groups/{group}/rename:
    parameters: [{ $ref: "#/components/parameters/Group" }]
    post:
      tags: [groups]
      summary: Rename
      requestBody: { content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 100 } } } } } }
      responses: { "200": { $ref: "#/components/responses/Group" } }

  # ---- identity, profiles, invites, media ----
  /api/v1/ponds:
    get:
      tags: [ponds]
      summary: The Ponds the owner is in. `version` changes whenever anything kept of any of them does.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  items: { type: array, items: { $ref: "objects/pond.yaml" } }
  /api/v1/ponds/join:
    post:
      tags: [ponds]
      summary: Join the Pond a pond:// invite names
      description: |
        `bad_link` (400) if it is not a pond:// link with an invite; `invite_refused` (409) if the Pond did not accept it (it
        does not say why); `no_profile` (404); `unreachable`, `not_a_pond` (502).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link: { type: string, maxLength: 400, examples: ["pond://pond.example.org?invite=abcdefghijklmnopqrstuvwxyz"] }
                profile: { type: [string, "null"], description: Which of the owner's profiles the members see; null or left out for none }
      responses:
        "201": { $ref: "#/components/responses/Pond" }
  /api/v1/ponds/{pond}:
    parameters: [{ $ref: "#/components/parameters/Pond" }]
    get:
      tags: [ponds]
      summary: The Pond, with the owner's member id and every member
      responses: { "200": { $ref: "#/components/responses/Pond" } }
  /api/v1/ponds/{pond}/channels/{channel}/messages:
    parameters: [{ $ref: "#/components/parameters/Pond" }, { $ref: "#/components/parameters/Channel" }]
    get:
      tags: [ponds]
      summary: A page of a channel, oldest first
      description: Answered from what the Puddle keeps (the newest 200 of each channel) when it can, else asked of the Pond.
      parameters:
        - { name: before, in: query, schema: { type: integer, minimum: 1 }, description: Only messages with a lower id; the newest when left out }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "objects/pond.yaml#/$defs/Message" } }
                  more: { type: boolean, description: There are older messages }
  /api/v1/ponds/{pond}/channels/{channel}/messages/send:
    parameters: [{ $ref: "#/components/parameters/Pond" }, { $ref: "#/components/parameters/Channel" }]
    post:
      tags: [ponds]
      summary: Post to a channel, with files
      description: |
        Files are given as for a conversation's send (each uploaded or taken first, so it is here whole). Each is sent to the
        Pond before the message, a chunk at a time, skipping what the Pond has already (docs/ponds.md, "Files"); the call
        answers once the message is posted. `bad_text`, `bad_file`, `too_many_files` (400); `slow_down` (429); `removed`
        (409: the Pond no longer has us); `no_file` (409: one is not here whole); `files_off` (409: the Pond takes no files);
        `too_large` (409: one is over the Pond's `files.max_size`); `unreachable` (502).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, minLength: 1, maxLength: 4000, description: Required without files }
                files:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [id, name, mime]
                    properties:
                      id: { type: string, pattern: "^[0-9a-f]{64}$" }
                      name: { type: string }
                      mime: { type: string }
                      w: { type: integer }
                      h: { type: integer }
                      duration_ms: { type: integer }
                      preview: { type: string }
      responses:
        "200": { description: Posted, content: { application/json: { schema: { type: object, properties: { sent: { const: true } } } } } }
  /api/v1/ponds/{pond}/channels/{channel}/messages/{message}/files/{file}/download:
    parameters:
      - { $ref: "#/components/parameters/Pond" }
      - { $ref: "#/components/parameters/Channel" }
      - { name: message, in: path, required: true, schema: { type: integer, minimum: 1 } }
      - { $ref: "#/components/parameters/File" }
    post:
      tags: [ponds]
      summary: "Fetch a file a Pond message carries that did not come by itself"
      description: |
        One over files.auto_download, or in a message older than the newest 200 of its channel. It is fetched from the Pond
        soon, and kept for a week past its message. Watch the message's file `state` and `received`. `removed` (409).
      responses:
        "204": { description: It will be fetched }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ponds/{pond}/profile:
    parameters: [{ $ref: "#/components/parameters/Pond" }]
    post:
      tags: [ponds]
      summary: Choose which of the owner's profiles the Pond's members see; the Pond is told
      requestBody: { content: { application/json: { schema: { type: object, required: [profile], properties: { profile: { type: [string, "null"] } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { profile: { type: [string, "null"] } } } } } }
  /api/v1/ponds/{pond}/leave:
    parameters: [{ $ref: "#/components/parameters/Pond" }]
    post:
      tags: [ponds]
      summary: Leave. The Pond is told if it can be reached; it is forgotten here either way, with everything kept of it.
      responses: { "204": { description: Left } }
  /api/v1/identity:
    get: { tags: [identity], summary: This Puddle's keys, responses: { "200": { $ref: "#/components/responses/Identity" } } }
  /api/v1/identity/roll:
    post:
      tags: [identity]
      summary: Start changing keys; checks the current phrase and hands back a new one. Nothing changes until confirm.
      requestBody: { content: { application/json: { schema: { type: object, required: [phrase], properties: { phrase: { type: string } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { new_phrase: { type: string }, expires_in: { type: integer } } } } } } }
  /api/v1/identity/roll/confirm:
    post: { tags: [identity], summary: The new phrase is written down, responses: { "200": { $ref: "#/components/responses/Identity" } } }
  /api/v1/identity/roll/cancel:
    post: { tags: [identity], summary: Abandon the roll, responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { cancelled: { type: boolean, description: "false when nothing was waiting" } } } } } } } }
  /api/v1/profiles:
    get:
      tags: [profiles]
      summary: The owner's profiles, by id (one page holds them all)
      responses: { "200": { description: OK, content: { application/json: { schema: { allOf: [{ $ref: "page.yaml" }, { properties: { items: { items: { $ref: "objects/own_profile.yaml" } } } }] } } } } }
  /api/v1/profiles/create:
    post:
      tags: [profiles]
      summary: A new profile, shown nowhere until it is chosen somewhere
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "objects/profile_fields.yaml"
                - { type: object, required: [id, display_name], properties: { id: { type: string, pattern: "^[a-z0-9_-]{1,32}$" } } }
      responses:
        "201": { description: Made, content: { application/json: { schema: { $ref: "objects/own_profile.yaml" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/profiles/{profile}:
    parameters: [{ $ref: "#/components/parameters/Profile" }]
    get: { tags: [profiles], summary: One profile, responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "objects/own_profile.yaml" } } } } } }
  /api/v1/profiles/{profile}/edit:
    parameters: [{ $ref: "#/components/parameters/Profile" }]
    post:
      tags: [profiles]
      summary: Change the fields given (null clears one); every place showing it is told
      requestBody: { content: { application/json: { schema: { $ref: "objects/profile_fields.yaml" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "objects/own_profile.yaml" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/profiles/{profile}/delete:
    parameters: [{ $ref: "#/components/parameters/Profile" }]
    post:
      tags: [profiles]
      summary: Delete it; every place it was shown is told to forget it, and sees nothing of the owner there any more
      responses: { "204": { description: Deleted } }
  /api/v1/profiles/reload:
    post:
      tags: [profiles]
      x-status: not built yet (docs/discuss-later.md, 2)
      summary: Read the profile files again, after editing them by hand
      responses: { "200": { description: OK, content: { application/json: { schema: { allOf: [{ $ref: "page.yaml" }, { properties: { items: { items: { $ref: "objects/own_profile.yaml" } } } }] } } } } }
  /api/v1/invites:
    get:
      tags: [invites]
      summary: Links still valid (one page holds them all)
      responses: { "200": { description: OK, content: { application/json: { schema: { allOf: [{ $ref: "page.yaml" }, { properties: { items: { items: { $ref: "objects/invite.yaml" } } } }] } } } } }
  /api/v1/invites/create:
    post:
      tags: [invites]
      summary: A new link
      requestBody: { content: { application/json: { schema: { type: object, properties: { uses: { type: integer, minimum: 1, maximum: 1000, default: 1 }, expires_in: { type: integer, minimum: 60, maximum: 2592000, default: 604800, description: seconds } } } } } }
      responses:
        "201": { description: Made, content: { application/json: { schema: { $ref: "objects/invite.yaml" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/invites/{token}/revoke:
    parameters: [{ name: token, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }]
    post: { tags: [invites], summary: Stop a link working, responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "objects/invite.yaml" } } } } } }
  /api/v1/media:
    get:
      summary: An image by hash
      parameters: [{ name: hash, in: query, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }]
      responses: { "200": { description: The file, content: { image/*: {} } } }
  /api/v1/media/upload:
    post:
      tags: [profiles]
      summary: Keep a picture for the owner's profiles (the bytes of a png, jpg, gif or webp, up to 25 MiB)
      requestBody: { content: { image/*: {} } }
      responses:
        "201": { description: Kept, content: { application/json: { schema: { $ref: "wire/media_ref.yaml" } } } }
        "400": { $ref: "#/components/responses/Error" }

  # ---- files ----
  /api/v1/conversations/{conversation}/messages/{message}/files/{file}/download:
    parameters: [{ $ref: "#/components/parameters/Conversation" }, { $ref: "#/components/parameters/Message" }, { $ref: "#/components/parameters/File" }]
    post:
      tags: [files]
      summary: "Fetch a file of a message: one over files.auto_download, or one that failed"
      description: It is fetched from its sender, or from anyone else in the chat who has it. Watch its `state` and `received`.
      responses:
        "200": { $ref: "#/components/responses/File" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`too_large`: past files.max_size", content: { application/json: { schema: { $ref: "objects/error.yaml" } } } }
  /api/v1/conversations/{conversation}/messages/{message}/files/{file}/cancel:
    parameters: [{ $ref: "#/components/parameters/Conversation" }, { $ref: "#/components/parameters/Message" }, { $ref: "#/components/parameters/File" }]
    post:
      tags: [files]
      summary: Stop fetching a file, and throw away what came (a file here whole stays)
      responses:
        "200": { $ref: "#/components/responses/File" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/conversations/{conversation}/messages/{message}/files/{file}/request:
    parameters: [{ $ref: "#/components/parameters/Conversation" }, { $ref: "#/components/parameters/Message" }, { $ref: "#/components/parameters/File" }]
    post:
      tags: [files]
      summary: Ask again for a file that was delivered here whole before
      description: |
        A Puddle delivers a file to a peer by itself once per message. After that, sending it again takes its owner's
        yes, every time (docs/files.md, "Asking again"). This asks everyone in the chat who may have it; the File says
        `asked` until one says yes and it arrives. Whoever would send it anyway just does.
      responses:
        "200": { $ref: "#/components/responses/File" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`too_large` (past files.max_size), `already_here`, or `nobody_to_ask`", content: { application/json: { schema: { $ref: "objects/error.yaml" } } } }
  /api/v1/conversations/{conversation}/messages/{message}/files/{file}/requests/{user}/accept:
    parameters:
      - { $ref: "#/components/parameters/Conversation" }
      - { $ref: "#/components/parameters/Message" }
      - { $ref: "#/components/parameters/File" }
      - { name: user, in: path, required: true, schema: { type: string }, description: Who asked }
    post:
      tags: [files]
      summary: "Send a file again to someone who asked: once"
      description: They are told, and fetch it; the yes is used up when they have it whole (or after a week).
      responses:
        "200": { $ref: "#/components/responses/File" }
        "404": { description: "`not_found`: no such request (answered already, or never made)", content: { application/json: { schema: { $ref: "objects/error.yaml" } } } }
  /api/v1/conversations/{conversation}/messages/{message}/files/{file}/requests/{user}/decline:
    parameters:
      - { $ref: "#/components/parameters/Conversation" }
      - { $ref: "#/components/parameters/Message" }
      - { $ref: "#/components/parameters/File" }
      - { name: user, in: path, required: true, schema: { type: string } }
    post:
      tags: [files]
      summary: "Do not send it again: the request is forgotten, and they are not told"
      responses:
        "200": { $ref: "#/components/responses/File" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/files/requests:
    get:
      tags: [files]
      summary: Everyone asking for a file again, waiting for the owner's answer, oldest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      required: [file, user, conversation, message, ts]
                      properties:
                        file: { type: string, pattern: "^[0-9a-f]{64}$" }
                        user: { type: string, description: Who asked }
                        conversation: { type: string }
                        message: { type: string, description: The message carrying it }
                        ts: { type: integer, description: When they asked (ms) }
  /api/v1/files/uploads/create:
    post:
      tags: [files]
      summary: Start sending the Puddle a file, a chunk at a time
      description: "For a phone client. The desktop app the Puddle runs inside hands it files directly (cloned, not uploaded); no route takes a path."
      requestBody: { content: { application/json: { schema: { type: object, required: [size], properties: { size: { type: integer, minimum: 1, description: "Bytes; `too_large` past files.max_size" } } } } } }
      responses:
        "201": { $ref: "#/components/responses/Upload" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/files/uploads/{upload}:
    parameters: [{ $ref: "#/components/parameters/Upload" }]
    get: { tags: [files], summary: How far an upload has got, responses: { "200": { $ref: "#/components/responses/Upload" } } }
  /api/v1/files/uploads/{upload}/chunks/{n}:
    parameters: [{ $ref: "#/components/parameters/Upload" }, { name: n, in: path, required: true, schema: { type: integer, minimum: 0 } }]
    post:
      tags: [files]
      summary: One chunk, as the request body (chunk_size bytes, the last one what is left)
      requestBody: { content: { application/octet-stream: {} } }
      responses:
        "200": { $ref: "#/components/responses/Upload" }
        "400": { description: "`bad_chunk`: no such chunk, or not that chunk's length", content: { application/json: { schema: { $ref: "objects/error.yaml" } } } }
  /api/v1/files/uploads/{upload}/finish:
    parameters: [{ $ref: "#/components/parameters/Upload" }]
    post:
      tags: [files]
      summary: Every chunk is here; the file is hashed and kept
      responses:
        "201": { $ref: "#/components/responses/File" }
        "409": { description: "`incomplete`: chunks are missing", content: { application/json: { schema: { $ref: "objects/error.yaml" } } } }
  /api/v1/files/uploads/{upload}/cancel:
    parameters: [{ $ref: "#/components/parameters/Upload" }]
    post: { tags: [files], summary: Throw an upload away, responses: { "200": { $ref: "#/components/responses/Upload" } } }
  /api/v1/files/usage:
    get:
      tags: [files]
      summary: The files kept here, the room they take, and the limits in force
      description: "A file is kept while a message carries it, and goes with the last one deleted; one uploaded and never sent goes after a day."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [files, bytes, max_size, auto_download]
                properties:
                  files: { type: integer, minimum: 0 }
                  bytes: { type: integer, minimum: 0, description: "Partial files count what has arrived" }
                  max_size: { type: integer, description: files.max_size in puddle.yaml }
                  auto_download: { type: integer, description: "files.auto_download (0: never by itself)" }
  /api/v1/files/{file}:
    parameters: [{ $ref: "#/components/parameters/File" }]
    get: { tags: [files], summary: "A file that is here, whole or partly", responses: { "200": { $ref: "#/components/responses/File" }, "404": { $ref: "#/components/responses/NotFound" } } }
  /api/v1/files/{file}/content:
    parameters: [{ $ref: "#/components/parameters/File" }]
    get:
      tags: [files]
      summary: "A whole file's bytes, read from disk as they are sent; a Range asks for part"
      responses:
        "200": { description: The file, content: { application/octet-stream: {} } }
        "206": { description: The part asked for, content: { application/octet-stream: {} } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- updates ----
  /api/v1/updates:
    get:
      tags: [updates]
      x-status: not built yet; the app reads the lists every two seconds
      summary: Objects as they change (Server-Sent Events)
      description: |
        Each event's `event:` is one of the types below and `data:` is that object, written by the same code as the
        routes, so an app applies an update exactly as it applies a reply. Reconnect with `Last-Event-ID`.
        (Was /api/v1/events; renamed so "event" only means a signed event.)

        - `message.created`, `message.updated`: a Message
        - `conversation.updated`: a Conversation (unread counts, last message)
        - `user.updated`: a User (profile, stream state, blocked, keys rolled)
        - `stream.updated`: a Stream
        - `group.updated`: a Group
      responses:
        "200": { description: The stream, content: { text/event-stream: { schema: { type: string } } } }

components:
  securitySchemes:
    owner:
      type: http
      scheme: bearer
      description: 64 hex characters, made on first run, in <data_dir>/state/owner-token (0600). Phone clients get their own.

  parameters:
    User: { name: user, in: path, required: true, schema: { $ref: "wire/ids.yaml#/$defs/UserId" } }
    Conversation:
      name: conversation
      in: path
      required: true
      description: A UserId for a DM, a ChatId for a group
      schema: { $ref: "wire/ids.yaml#/$defs/ChatId" }
    Group: { name: group, in: path, required: true, schema: { $ref: "wire/ids.yaml#/$defs/ChatId" } }
    Message: { name: message, in: path, required: true, schema: { $ref: "wire/ids.yaml#/$defs/EventId" } }
    File: { name: file, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    Upload: { name: upload, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
    Profile: { name: profile, in: path, required: true, description: One of the owner's profile ids, schema: { type: string, pattern: "^[a-z0-9_-]{1,32}$" } }
    Pond: { name: pond, in: path, required: true, description: The Pond's id, made like a user id, schema: { $ref: "wire/ids.yaml#/$defs/UserId" } }
    Channel: { name: channel, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    Offset: { name: offset, in: query, description: "Where to start: a page's `next`", schema: { type: integer, minimum: 0, default: 0 } }

  responses:
    User: { description: OK, content: { application/json: { schema: { $ref: "objects/user.yaml" } } } }
    SelfUser: { description: OK, content: { application/json: { schema: { $ref: "objects/self_user.yaml" } } } }
    Stream: { description: OK, content: { application/json: { schema: { $ref: "objects/stream.yaml" } } } }
    Conversation: { description: OK, content: { application/json: { schema: { $ref: "objects/conversation.yaml" } } } }
    Message: { description: OK, content: { application/json: { schema: { $ref: "objects/message.yaml" } } } }
    File: { description: OK, content: { application/json: { schema: { $ref: "objects/file.yaml" } } } }
    Upload: { description: OK, content: { application/json: { schema: { $ref: "objects/upload.yaml" } } } }
    Group: { description: OK, content: { application/json: { schema: { $ref: "objects/group.yaml" } } } }
    Pond: { description: OK, content: { application/json: { schema: { $ref: "objects/pond.yaml" } } } }
    Identity: { description: OK, content: { application/json: { schema: { $ref: "objects/identity.yaml" } } } }
    Error: { description: Not possible now, content: { application/json: { schema: { $ref: "objects/error.yaml" } } } }
    NotFound: { description: No such thing, or not allowed (the same answer), content: { application/json: { schema: { $ref: "objects/error.yaml" } } } }
