$schema: https://json-schema.org/draft/2020-12/schema
title: PartialUser
description: |
  Enough of a User to draw them: embedded wherever a person appears (a message's author, a group member, a
  conversation's other person). The full User is GET /api/v1/users/{user}.
type: object
required: [id, display_name]
properties:
  id: { $ref: "../wire/ids.yaml#/$defs/UserId" }
  display_name: { type: string, description: Their profile's name, else a short form of the id }
  avatar: { $ref: "../wire/media_ref.yaml" }
  color: { $ref: "../wire/color.yaml" }
