$schema: https://json-schema.org/draft/2020-12/schema
title: Invite
description: A link that is accepted automatically when someone asks for a stream with it
type: object
required: [link, token, expires_at, uses]
properties:
  link: { type: string }
  token: { type: string, description: What is revoked }
  expires_at: { $ref: "../wire/ids.yaml#/$defs/Timestamp" }
  uses: { type: integer, description: Uses remaining }
x-methods:
  revoke: POST /api/v1/invites/{token}/revoke
