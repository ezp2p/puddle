$schema: https://json-schema.org/draft/2020-12/schema
title: Pond
description: |
  A Pond the owner is in, as this Puddle keeps it (docs/ponds.md): what the Pond last told us, cleaned. GET /api/v1/ponds lists
  them without `me` and `members`; GET /api/v1/ponds/{pond} has both.
type: object
required: [id, name, description, address, status, protocol, features, channels]
properties:
  id: { $ref: "../wire/ids.yaml#/$defs/UserId", description: "The Pond's id, made from its key like a user id" }
  name: { type: string, maxLength: 400 }
  description: { type: string }
  address: { type: string, description: "host[:port] it is reached at" }
  status:
    enum: [connecting, connected, unreachable, removed, certificate_changed]
    description: "`removed`: the Pond no longer has the owner as a member; what was kept can still be read until they leave"
  protocol: { type: integer, minimum: 1, description: "Which additions to /pond/v1 the Pond said it has, at its last /info" }
  features: { type: array, items: { type: string, pattern: "^[a-z0-9_-]{1,32}$" }, description: Optional parts the Pond said it has }
  channels: { type: array, items: { $ref: "#/$defs/Channel" } }
  me: { $ref: "../wire/ids.yaml#/$defs/UserId", description: The owner's member id (their user id) }
  members: { type: array, items: { $ref: "#/$defs/Member" } }
x-methods:
  messages: GET /api/v1/ponds/{pond}/channels/{channel}/messages
  send: POST /api/v1/ponds/{pond}/channels/{channel}/messages/send
  profile: POST /api/v1/ponds/{pond}/profile
  leave: POST /api/v1/ponds/{pond}/leave
$defs:
  Channel:
    type: object
    properties:
      id: { type: integer }
      name: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
      topic: { type: string, maxLength: 1024 }
      last: { type: integer, description: The newest message id kept; 0 for none }
  Member:
    type: object
    properties:
      id: { $ref: "../wire/ids.yaml#/$defs/UserId" }
      profile: { oneOf: [{ $ref: "../wire/profile.yaml" }, { type: "null" }], description: What they chose to show in this Pond, cleaned }
      joined: { type: integer, description: ms }
  Message:
    type: object
    properties:
      id: { type: integer, description: Increasing across the whole Pond }
      channel: { type: integer }
      author: { $ref: "../wire/ids.yaml#/$defs/UserId" }
      text: { type: string, maxLength: 4000 }
      ts: { type: integer, description: ms, by the Pond's clock }
