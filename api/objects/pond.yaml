$schema: https://json-schema.org/draft/2020-12/schema
title: Pond
description: |
  A Pond the owner is in, as this Puddle keeps it (docs/ponds.md): what the Pond last told us, cleaned. GET /api/v1/ponds lists
  them without `me` and `members`; GET /api/v1/ponds/{pond} has both.
type: object
required: [id, name, description, address, status, protocol, features, channels]
properties:
  id: { $ref: "../wire/ids.yaml#/$defs/UserId", description: "The Pond's id, made from its key like a user id" }
  name: { type: string, maxLength: 400 }
  description: { type: string }
  icon:
    description: |
      The Pond's icon (its feature `pictures`), as a profile names a picture; null for none. The Puddle fetches it from the Pond
      by itself, so `GET /api/v1/media?hash=` has it once it is here (docs/ponds.md, "Pictures").
    oneOf:
      - type: object
        properties: { hash: { type: string, pattern: "^[0-9a-f]{64}$" }, mime: { type: string }, size: { type: integer } }
      - type: "null"
  address: { type: string, description: "host[:port] it is reached at" }
  status:
    enum: [connecting, connected, unreachable, removed, certificate_changed, not_proven]
    description: |
      `removed`: the Pond no longer has the owner as a member; what was kept can still be read until they leave.
      `certificate_changed`: a Pond without receipts showed a certificate other than the one pinned at join.
      `not_proven`: a Pond that signs its answers didn't prove what answered (docs/ponds.md, "Proving who answers").
  protocol: { type: integer, minimum: 1, description: "Which additions to /pond/v1 the Pond said it has, at its last /info" }
  features: { type: array, items: { type: string, pattern: "^[a-z0-9_-]{1,32}$" }, description: Optional parts the Pond said it has }
  files:
    type: object
    description: What the Pond takes, if it said (it has the `files` feature); left out if it takes none
    properties:
      max_size: { type: integer, description: "The largest file it takes; 0 if its admin turned files off" }
  dms:
    type: object
    description: "Direct messages between members (a Pond of protocol 8; docs/pond-dms.md); left out if it has none"
    properties:
      on: { type: boolean, description: "False when its admin turned them off" }
      files_max: { type: integer, description: "The largest file one may carry; 0 none" }
  role: { enum: [operator, administrator, member], description: "Ours there (docs/ponds.md, \"Roles\")" }
  offer:
    description: A role the Pond offers us, waiting for the owner's answer
    oneOf:
      - { type: object, properties: { id: { type: integer }, role: { enum: [operator, administrator] } } }
      - { type: "null" }
  roles:
    type: array
    description: "The Pond's roles for channels (a Pond of protocol 9; docs/ponds.md, \"Roles for channels\"), made by its operators and administrators"
    items: { type: object, properties: { id: { type: integer }, name: { type: string, maxLength: 32 } } }
  channels: { type: array, items: { $ref: "#/$defs/Channel" }, description: "The channels we may see, in the order the Pond's admins set" }
  me: { $ref: "../wire/ids.yaml#/$defs/UserId", description: The owner's member id (their user id) }
  members: { type: array, items: { $ref: "#/$defs/Member" } }
x-methods:
  messages: GET /api/v1/ponds/{pond}/channels/{channel}/messages
  send: POST /api/v1/ponds/{pond}/channels/{channel}/messages/send
  download: POST /api/v1/ponds/{pond}/channels/{channel}/messages/{message}/files/{file}/download
  profile: POST /api/v1/ponds/{pond}/profile
  leave: POST /api/v1/ponds/{pond}/leave
  join_voice: POST /api/v1/ponds/{pond}/channels/{channel}/voice/join
$defs:
  Channel:
    type: object
    properties:
      id: { type: integer }
      name: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
      topic: { type: string, maxLength: 1024 }
      last: { type: integer, description: The newest message id kept; 0 for none }
      kind: { enum: [text, voice], description: "A voice channel (docs/ponds.md, \"Voice channels\") takes messages too" }
      roles: { type: array, items: { type: integer }, description: "Present when it is not open to everyone: operators, administrators and members with one of these roles see it" }
      voice:
        type: array
        description: A voice channel's people now, as the Pond last said
        items:
          type: object
          properties:
            member: { $ref: "../wire/ids.yaml#/$defs/UserId" }
            slot: { type: integer, description: "Their number in the channel: the frames the Pond forwards are marked with it" }
            muted: { type: boolean }
            deafened: { type: boolean }
            camera: { type: boolean }
            screen: { type: boolean, description: Sharing a screen }
  Member:
    type: object
    properties:
      id: { $ref: "../wire/ids.yaml#/$defs/UserId" }
      profile: { oneOf: [{ $ref: "../wire/profile.yaml" }, { type: "null" }], description: "What they chose to show in this Pond, cleaned. Its pictures are fetched from the Pond by themselves (docs/ponds.md, \"Pictures\")" }
      joined: { type: integer, description: ms }
      muted:
        description: "Muted by an operator or administrator (a Pond of protocol 7): until when (ms), or null until unmuted. null when not muted."
        oneOf:
          - { type: object, properties: { until: { oneOf: [{ type: integer }, { type: "null" }] } } }
          - type: "null"
      role: { enum: [operator, administrator, member] }
      roles: { type: array, items: { type: integer }, description: "The roles for channels they hold (a Pond of protocol 9)" }
      dms: { type: boolean, description: "Present, and false, when they take no direct messages in this Pond (protocol 8)" }
  Message:
    type: object
    properties:
      id: { type: integer, description: Increasing across the whole Pond }
      channel: { type: integer }
      author: { $ref: "../wire/ids.yaml#/$defs/UserId" }
      text: { type: string, maxLength: 4000, description: May be empty when there are files }
      ts: { type: integer, description: ms, by the Pond's clock }
      files:
        type: array
        description: Left out when there are none. Each as a conversation's message has them, with what is here of it.
        items: { $ref: "file.yaml" }
