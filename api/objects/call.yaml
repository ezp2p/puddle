$schema: https://json-schema.org/draft/2020-12/schema
title: Call
description: |
  A call with a friend (docs/calls.md). The Puddles carry it; the owner's device records and plays. GET /api/v1/calls lists the
  call going on, if any, then the last few that ended, newest first.
type: object
required: [id, user, direction, state, reason, media, created, answered, ended]
properties:
  id: { type: string, pattern: "^[a-z2-7]{26}$" }
  user: { $ref: "../wire/ids.yaml#/$defs/UserId", description: The friend }
  direction: { type: string, enum: [outgoing, incoming] }
  state:
    type: string
    enum: [calling, ringing, connecting, active, ended]
    description: "`calling`: ours, ringing at theirs. `ringing`: theirs, waiting for the owner. `connecting`: accepted, finding a path. `active`: connected."
  reason:
    type: [string, "null"]
    enum: [hung_up, declined, cancelled, no_answer, missed, busy, failed, unreachable, no_calls, null]
    description: How it ended; null until it has
  media: { type: boolean, description: Media can flow (the audio track is open) }
  created: { $ref: "../wire/ids.yaml#/$defs/Timestamp" }
  answered: { oneOf: [{ $ref: "../wire/ids.yaml#/$defs/Timestamp" }, { type: "null" }], description: When it connected }
  ended: { oneOf: [{ $ref: "../wire/ids.yaml#/$defs/Timestamp" }, { type: "null" }] }
x-methods:
  accept: POST /api/v1/calls/{call}/accept
  decline: POST /api/v1/calls/{call}/decline
  end: POST /api/v1/calls/{call}/end
