# Your Puddle, headless, in Docker (docs/docker.md). The file on its own is enough: no checkout needed.
#
#   1. Beside this file, a .env (copy .env.example) with at least PUDDLE_ADVERTISE: the address other people's Puddles
#      reach you at, "home.example.org:8443", with that port (TCP and UDP) forwarded to this machine.
#   2. docker compose up -d
#   3. docker compose exec puddle puddled --init    once: makes your identity and shows your recovery phrase (only in
#                                                   that terminal, never in the logs). Write it down. Then it starts.
#   4. Connect the phone app to it (docs/docker.md, "Connect your phone").
#
# Updating: docker compose pull && docker compose up -d. Everything the Puddle keeps is in the "puddle" volume.

services:
  puddle:
    image: ${PUDDLE_IMAGE:-ghcr.io/ezp2p/puddle:latest}
    container_name: puddle   # so docker exec puddle … (docs/docker.md) finds it
    restart: unless-stopped
    environment:
      PUDDLE_ADVERTISE: ${PUDDLE_ADVERTISE:?set PUDDLE_ADVERTISE in .env, e.g. home.example.org:8443}
      PUDDLE_NAME: ${PUDDLE_NAME:-}          # if set, a first profile with this display name
      PUDDLE_PORT: ${PUDDLE_PORT:-8443}
    ports:
      - "${PUDDLE_PORT:-8443}:${PUDDLE_PORT:-8443}/tcp"
      - "${PUDDLE_PORT:-8443}:${PUDDLE_PORT:-8443}/udp"   # calls
    volumes:
      - puddle:/data

volumes:
  puddle:
