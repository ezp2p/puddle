name: docker

# On a release (a tag like 0.0.1, as in build.yml), build the puddled image for amd64 (arm64 later) and publish it to
# ghcr.io/<owner>/<repo>: tagged with the version, its minor and major (not for a 0.x major), and "latest" unless
# it is a prerelease (a tag with a "-", such as 0.2.0-rc.1).
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:   # build and push the image for an existing tag by hand (run it on that tag)

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, '0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=puddled
            org.opencontainers.image.description=Puddle, headless: self-hosted chat on your own computer

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
