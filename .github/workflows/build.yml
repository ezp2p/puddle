name: build

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']   # releases are tags like 0.0.0 (no "v")
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: headless service only, built on the oldest supported LTS for glibc compatibility
          - { name: linux-amd64, os: ubuntu-22.04,     gui: OFF }
          - { name: linux-arm64, os: ubuntu-22.04-arm, gui: OFF }
          # macOS: the Puddle app (embeds the server)
          - { name: macos-arm64, os: macos-15,         gui: ON }
          - { name: macos-amd64, os: macos-15-intel,   gui: ON }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libssl-dev libyaml-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 libyaml qt

      - name: Configure
        run: |
          EXTRA=()
          # Homebrew's OpenSSL is keg-only (prefix differs on Intel vs Apple Silicon)
          if [ "${{ runner.os }}" = macOS ]; then EXTRA+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"); fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPUDDLE_STATIC_OPENSSL=ON \
            -DPUDDLE_BUILD_GUI=${{ matrix.gui }} \
            "${EXTRA[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then VERSION="${{ github.ref_name }}"; else VERSION="${GITHUB_SHA::7}"; fi
          NAME="puddle-$VERSION-${{ matrix.name }}"
          mkdir -p "stage/$NAME" out
          cp README.md "stage/$NAME/"
          if [ "${{ runner.os }}" = Linux ]; then
            strip build/puddled
            cp build/puddled dist/puddled.service "stage/$NAME/"
            tar -C stage -czf "out/$NAME.tar.gz" "$NAME"
          else
            "$(brew --prefix qt)/bin/macdeployqt" build/Puddle.app -qmldir=src/gui/qml || true  # noisy with Homebrew's split Qt
            # macdeployqt's own signature is invalid afterwards (macOS kills the app); re-sign ad hoc
            codesign --force --deep -s - build/Puddle.app
            codesign --verify --deep --strict build/Puddle.app
            cp -R build/Puddle.app "stage/$NAME/"
            ditto -c -k --keepParent "stage/$NAME" "out/$NAME.zip"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd out
          sha256sum * > SHA256SUMS
          case "$TAG" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $PRE *
